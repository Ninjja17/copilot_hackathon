<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SyncUp — Interactive Problem Intake Agent (Interaction-First)</title>
  <meta name="description" content="Interaction-first problem intake companion with glowing AI orb, voice and chat, powered by Hume AI & ElevenLabs aesthetic." />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23D4FF24'><circle cx='12' cy='12' r='10'/></svg>" />

  <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Interaction-First Stylesheet -->
  <link rel="stylesheet" href="styles.css" />

  <!-- React 18, ReactDOM & Babel -->
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.24.0/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <!-- React 18 Application: Interaction-First Architecture -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;



    // ========================================================
    // Inspira UI: BorderBeam Laser Animation
    // ========================================================
    function BorderBeam() {
      return (
        <div className="inspira-border-beam" aria-hidden="true">
          <div className="beam-glow"></div>
        </div>
      );
    }

    // ========================================================
    // Inspira UI: Meteors Ambient Particle System
    // ========================================================
    function Meteors({ count = 14 }) {
      const meteors = useRef(
        Array.from({ length: count }, () => ({
          top: Math.random() * 65 + "%",
          left: Math.random() * 100 + "%",
          delay: (Math.random() * 7).toFixed(1) + "s",
          duration: (3.5 + Math.random() * 4).toFixed(1) + "s"
        }))
      ).current;

      return (
        <div className="inspira-meteors-container" aria-hidden="true">
          {meteors.map((m, idx) => (
            <span
              key={idx}
              className="inspira-meteor"
              style={{
                top: m.top,
                left: m.left,
                animationDelay: m.delay,
                animationDuration: m.duration
              }}
            />
          ))}
        </div>
      );
    }

    // ========================================================
    // Inspira UI: CardSpotlight Interactive Cursor Glow
    // ========================================================
    function CardSpotlight({ children, className = "", style = {} }) {
      const cardRef = useRef(null);
      const [coords, setCoords] = useState({ x: 0, y: 0 });
      const [opacity, setOpacity] = useState(0);

      const handleMouseMove = (e) => {
        if (!cardRef.current) return;
        const rect = cardRef.current.getBoundingClientRect();
        setCoords({ x: e.clientX - rect.left, y: e.clientY - rect.top });
      };

      return (
        <div
          ref={cardRef}
          onMouseMove={handleMouseMove}
          onMouseEnter={() => setOpacity(1)}
          onMouseLeave={() => setOpacity(0)}
          className={`inspira-card-spotlight ${className}`}
          style={style}
        >
          <div
            className="spotlight-overlay"
            style={{
              opacity,
              background: `radial-gradient(550px circle at ${coords.x}px ${coords.y}px, rgba(21, 88, 201, 0.16), transparent 75%)`
            }}
          />
          {children}
        </div>
      );
    }

    // ========================================================
    // Canvas UI: Ambient Reactive Particle Field (Pattern #75)
    // ========================================================
    function CanvasParticleField() {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext("2d");
        if (!ctx) return;

        let animId;
        let width = (canvas.width = window.innerWidth);
        let height = (canvas.height = window.innerHeight);

        const onResize = () => {
          if (!canvas) return;
          width = canvas.width = window.innerWidth;
          height = canvas.height = window.innerHeight;
        };
        window.addEventListener("resize", onResize);

        const mouse = { x: -1000, y: -1000, active: false };
        const onMouseMove = (e) => {
          mouse.x = e.clientX;
          mouse.y = e.clientY;
          mouse.active = true;
        };
        const onMouseLeave = () => {
          mouse.active = false;
        };
        window.addEventListener("mousemove", onMouseMove);
        window.addEventListener("mouseleave", onMouseLeave);

        const nodeCount = Math.min(Math.floor((width * height) / 24000), 50);
        const nodes = Array.from({ length: nodeCount }, () => ({
          x: Math.random() * width,
          y: Math.random() * height,
          vx: (Math.random() - 0.5) * 0.45,
          vy: (Math.random() - 0.5) * 0.45,
          radius: Math.random() * 1.6 + 0.8,
          color: Math.random() > 0.86 ? "#D4FF24" : "#1558C9" // 10% lime, 30% cobalt
        }));

        const render = () => {
          ctx.clearRect(0, 0, width, height);

          // Render node network and physics displacement
          for (let i = 0; i < nodes.length; i++) {
            const a = nodes[i];
            a.x += a.vx;
            a.y += a.vy;

            if (a.x < 0) a.x = width;
            if (a.x > width) a.x = 0;
            if (a.y < 0) a.y = height;
            if (a.y > height) a.y = 0;

            // Canvas UI Pointer Displacement Vector
            if (mouse.active) {
              const dx = a.x - mouse.x;
              const dy = a.y - mouse.y;
              const dist = Math.sqrt(dx * dx + dy * dy);
              if (dist < 130) {
                const force = (130 - dist) / 130;
                a.x += (dx / dist) * force * 2.2;
                a.y += (dy / dist) * force * 2.2;
              }
            }

            // Draw Node
            ctx.beginPath();
            ctx.arc(a.x, a.y, a.radius, 0, Math.PI * 2);
            ctx.fillStyle = a.color === "#D4FF24" ? "rgba(212, 255, 36, 0.85)" : "rgba(21, 88, 201, 0.85)";
            ctx.fill();

            // Connect nearest filaments
            for (let j = i + 1; j < nodes.length; j++) {
              const b = nodes[j];
              const dx = a.x - b.x;
              const dy = a.y - b.y;
              const dist = Math.sqrt(dx * dx + dy * dy);

              if (dist < 115) {
                const alpha = (1 - dist / 115) * 0.2;
                ctx.beginPath();
                ctx.moveTo(a.x, a.y);
                ctx.lineTo(b.x, b.y);
                ctx.strokeStyle = `rgba(21, 88, 201, ${alpha})`;
                ctx.lineWidth = 0.8;
                ctx.stroke();
              }
            }
          }

          animId = requestAnimationFrame(render);
        };

        animId = requestAnimationFrame(render);

        return () => {
          cancelAnimationFrame(animId);
          window.removeEventListener("resize", onResize);
          window.removeEventListener("mousemove", onMouseMove);
          window.removeEventListener("mouseleave", onMouseLeave);
        };
      }, []);

      return (
        <canvas
          ref={canvasRef}
          className="canvas-ui-ambient-field"
          aria-hidden="true"
        />
      );
    }

    // ========================================================
    // Fluid Waveform Visualizer (Dribbble-Grade Audio Ribbon)
    // 60fps 3-layer harmonic sine wave with Gaussian envelope
    // ========================================================
    // ========================================================
    // Fluid Waveform Visualizer (Gemini & OpenAI Audio Ribbon)
    // 60fps 4-layer chromatic fluid ribbon with photon sparkles
    // ========================================================
    function FluidWaveformVisualizer({ isSpeaking, isRecording }) {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext("2d");
        if (!ctx) return;

        let animId;
        let phase = 0;
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const width = 420;
        const height = 52;

        canvas.width = width * dpr;
        canvas.height = height * dpr;
        canvas.style.width = `${width}px`;
        canvas.style.height = `${height}px`;

        const render = () => {
          const speed = isSpeaking ? 0.058 : isRecording ? 0.072 : 0.022;
          phase += speed;

          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.save();
          ctx.scale(dpr, dpr);

          const cy = height / 2;
          const targetAmp = isSpeaking ? 18 : isRecording ? 15 : 4.5;

          const waves = [
            {
              color: "rgba(21, 88, 201, 0.55)",
              glow: "rgba(21, 88, 201, 0.75)",
              lineWidth: 2.2,
              freq: 0.022,
              phaseOffset: phase * 0.85,
              ampMult: 0.82
            },
            {
              color: "rgba(0, 240, 255, 0.75)",
              glow: "rgba(0, 240, 255, 0.85)",
              lineWidth: 1.8,
              freq: 0.034,
              phaseOffset: phase * 1.25 + Math.PI / 3.5,
              ampMult: 0.76
            },
            {
              color: isRecording ? "#D4FF24" : "rgba(121, 176, 255, 0.9)",
              glow: isRecording ? "rgba(212, 255, 36, 0.95)" : "rgba(121, 176, 255, 0.9)",
              lineWidth: 2.4,
              freq: 0.042,
              phaseOffset: phase * 1.6 + Math.PI / 1.6,
              ampMult: 1.0
            },
            {
              color: "rgba(255, 255, 255, 0.85)",
              glow: "rgba(255, 255, 255, 0.9)",
              lineWidth: 1.2,
              freq: 0.05,
              phaseOffset: phase * 1.9 + Math.PI,
              ampMult: 0.65
            }
          ];

          waves.forEach((w) => {
            ctx.beginPath();
            ctx.strokeStyle = w.color;
            ctx.lineWidth = w.lineWidth;
            ctx.shadowColor = w.glow;
            ctx.shadowBlur = isSpeaking || isRecording ? 14 : 6;

            for (let x = 0; x <= width; x += 3) {
              const norm = (x - width / 2) / (width * 0.44);
              const envelope = Math.exp(-norm * norm);
              const y =
                cy +
                Math.sin(x * w.freq + w.phaseOffset) * targetAmp * w.ampMult * envelope +
                Math.sin(x * w.freq * 2.2 + w.phaseOffset * 1.4) * (targetAmp * 0.38) * envelope +
                Math.cos(x * w.freq * 3.1 - w.phaseOffset * 0.8) * (targetAmp * 0.18) * envelope;

              if (x === 0) {
                ctx.moveTo(x, y);
              } else {
                ctx.lineTo(x, y);
              }
            }
            ctx.stroke();
          });

          if (isSpeaking || isRecording) {
            const sparkleCount = 5;
            for (let s = 0; s < sparkleCount; s++) {
              const sx = ((phase * 45 + s * (width / sparkleCount)) % width);
              const norm = (sx - width / 2) / (width * 0.44);
              const env = Math.exp(-norm * norm);
              const sy = cy + Math.sin(sx * 0.04 + phase * 1.6) * targetAmp * env;

              ctx.beginPath();
              ctx.arc(sx, sy, 1.8, 0, Math.PI * 2);
              ctx.fillStyle = isRecording ? "#D4FF24" : "#00F0FF";
              ctx.shadowColor = "#FFFFFF";
              ctx.shadowBlur = 8;
              ctx.fill();
            }
          }

          ctx.restore();
          animId = requestAnimationFrame(render);
        };

        animId = requestAnimationFrame(render);
        return () => cancelAnimationFrame(animId);
      }, [isSpeaking, isRecording]);

      return (
        <div className="fluid-waveform-wrapper">
          <canvas ref={canvasRef} className="fluid-waveform-canvas" />
        </div>
      );
    }

    // ========================================================
    // Canvas UI: Gemini & OpenAI Living Voice Organism
    // Living organic fluid blob, Gemini 4-point star core,
    // and acoustic resonance shockwaves on speech & interaction.
    // ========================================================
    function CanvasFluidOrb({ isSpeaking, isRecording, onClick }) {
      const canvasRef = useRef(null);
      const shockwavesRef = useRef([]);
      const energyRef = useRef(0.2);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext("2d");
        if (!ctx) return;

        let animId;
        let time = 0;
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const size = 250;
        canvas.width = size * dpr;
        canvas.height = size * dpr;
        canvas.style.width = `${size}px`;
        canvas.style.height = `${size}px`;

        const cx = size / 2;
        const baseCy = size / 2;
        const baseRadius = 66;

        const particles = Array.from({ length: 20 }, (_, i) => ({
          angle: (i / 20) * Math.PI * 2,
          speed: 0.014 + (i % 5) * 0.005,
          distOffset: ((i % 4) - 1.5) * 16,
          size: 1.2 + (i % 4) * 0.7,
          tilt: 0.38 + (i % 3) * 0.15,
          hue: i % 2 === 0 ? "cyan" : "lime"
        }));

        const render = () => {
          const targetEnergy = isSpeaking ? 1.0 : isRecording ? 0.75 : 0.22;
          energyRef.current += (targetEnergy - energyRef.current) * 0.08;
          const energy = energyRef.current;

          const speed = 0.02 + energy * 0.038;
          time += speed;

          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.save();
          ctx.scale(dpr, dpr);

          const floatY = Math.sin(time * 1.5) * (3 + energy * 3);
          const cy = baseCy + floatY;

          // 1. Outer Volumetric Aurora Bloom
          const bloomRadius = baseRadius * (1.4 + energy * 0.5 + Math.sin(time * 2) * 0.05);
          const bloomGrad = ctx.createRadialGradient(cx, cy, baseRadius * 0.4, cx, cy, bloomRadius);
          if (isSpeaking) {
            bloomGrad.addColorStop(0, "rgba(21, 88, 201, 0.45)");
            bloomGrad.addColorStop(0.45, "rgba(0, 240, 255, 0.18)");
            bloomGrad.addColorStop(0.75, "rgba(212, 255, 36, 0.08)");
            bloomGrad.addColorStop(1, "rgba(3, 4, 7, 0)");
          } else if (isRecording) {
            bloomGrad.addColorStop(0, "rgba(0, 240, 255, 0.38)");
            bloomGrad.addColorStop(0.5, "rgba(212, 255, 36, 0.22)");
            bloomGrad.addColorStop(0.8, "rgba(21, 88, 201, 0.08)");
            bloomGrad.addColorStop(1, "rgba(3, 4, 7, 0)");
          } else {
            bloomGrad.addColorStop(0, "rgba(21, 88, 201, 0.28)");
            bloomGrad.addColorStop(0.5, "rgba(56, 189, 248, 0.1)");
            bloomGrad.addColorStop(1, "rgba(3, 4, 7, 0)");
          }
          ctx.beginPath();
          ctx.arc(cx, cy, bloomRadius, 0, Math.PI * 2);
          ctx.fillStyle = bloomGrad;
          ctx.fill();

          // 2. OpenAI-Style Acoustic Resonance Shockwaves
          const ringCount = 3;
          for (let i = 0; i < ringCount; i++) {
            const ringPhase = (time * 1.6 + i * (Math.PI * 2 / ringCount)) % (Math.PI * 2);
            const progress = ringPhase / (Math.PI * 2);
            const ringR = baseRadius + progress * (42 + energy * 28);
            const ringAlpha = Math.sin(progress * Math.PI) * (0.15 + energy * 0.45);

            ctx.save();
            ctx.beginPath();
            const numRingPoints = 48;
            for (let j = 0; j <= numRingPoints; j++) {
              const theta = (j / numRingPoints) * Math.PI * 2;
              const undulation = Math.sin(theta * 3 + time * 3) * (1.5 + energy * 3);
              const r = ringR + undulation;
              const rx = cx + Math.cos(theta) * r;
              const ry = cy + Math.sin(theta) * r;
              if (j === 0) ctx.moveTo(rx, ry);
              else ctx.lineTo(rx, ry);
            }
            ctx.closePath();
            ctx.strokeStyle = isRecording
              ? `rgba(212, 255, 36, ${ringAlpha})`
              : `rgba(56, 189, 248, ${ringAlpha})`;
            ctx.lineWidth = 1.2 + energy * 0.8;
            ctx.shadowColor = isRecording ? "rgba(212, 255, 36, 0.8)" : "rgba(56, 189, 248, 0.8)";
            ctx.shadowBlur = 10;
            ctx.stroke();
            ctx.restore();
          }

          // Click shockwaves
          for (let i = shockwavesRef.current.length - 1; i >= 0; i--) {
            const sw = shockwavesRef.current[i];
            sw.r += 3.8;
            sw.alpha *= 0.92;
            if (sw.alpha < 0.02) {
              shockwavesRef.current.splice(i, 1);
              continue;
            }
            ctx.save();
            ctx.beginPath();
            ctx.arc(cx, cy, sw.r, 0, Math.PI * 2);
            ctx.strokeStyle = `rgba(212, 255, 36, ${sw.alpha})`;
            ctx.lineWidth = 2;
            ctx.shadowColor = "rgba(212, 255, 36, 0.9)";
            ctx.shadowBlur = 14;
            ctx.stroke();
            ctx.restore();
          }

          // 3. Orbital Particles (Behind)
          particles.forEach((p) => {
            p.angle += p.speed * (1 + energy * 1.2);
            const sinA = Math.sin(p.angle);
            if (sinA < 0) {
              const cosA = Math.cos(p.angle);
              const orbitR = baseRadius + 18 + p.distOffset;
              const px = cx + cosA * orbitR;
              const py = cy + sinA * (orbitR * p.tilt);
              const alpha = 0.2 + (-sinA) * 0.4;
              ctx.beginPath();
              ctx.arc(px, py, p.size * 0.85, 0, Math.PI * 2);
              ctx.fillStyle = p.hue === "cyan"
                ? `rgba(56, 189, 248, ${alpha})`
                : `rgba(212, 255, 36, ${alpha})`;
              ctx.fill();
            }
          });

          // 4. Primary Living Fluid Morphing Body (OpenAI + Gemini)
          const numPoints = 84;
          const fluidPoints = [];

          for (let i = 0; i < numPoints; i++) {
            const theta = (i / numPoints) * Math.PI * 2;
            const h2 = Math.sin(theta * 2 + time * 1.8) * (5 + energy * 11);
            const h3 = Math.cos(theta * 3 - time * 2.2) * (4 + energy * 9);
            const h4 = Math.sin(theta * 4 + time * 1.1) * (6 + energy * 13);
            const h5 = Math.cos(theta * 5 + time * 3.4) * (2 + energy * 5.5);
            const h7 = Math.sin(theta * 7 - time * 4.2) * (1.5 + energy * 3.5);

            const r = baseRadius + h2 + h3 + h4 + h5 + h7;
            const x = cx + Math.cos(theta) * r;
            const y = cy + Math.sin(theta) * r;
            fluidPoints.push({ x, y });
          }

          ctx.beginPath();
          const firstMidX = (fluidPoints[0].x + fluidPoints[numPoints - 1].x) / 2;
          const firstMidY = (fluidPoints[0].y + fluidPoints[numPoints - 1].y) / 2;
          ctx.moveTo(firstMidX, firstMidY);

          for (let i = 0; i < numPoints; i++) {
            const p0 = fluidPoints[i];
            const p1 = fluidPoints[(i + 1) % numPoints];
            const midX = (p0.x + p1.x) / 2;
            const midY = (p0.y + p1.y) / 2;
            ctx.quadraticCurveTo(p0.x, p0.y, midX, midY);
          }
          ctx.closePath();

          const gradAngle = time * 0.8;
          const gx1 = cx + Math.cos(gradAngle) * baseRadius;
          const gy1 = cy + Math.sin(gradAngle) * baseRadius;
          const gx2 = cx - Math.cos(gradAngle) * baseRadius;
          const gy2 = cy - Math.sin(gradAngle) * baseRadius;

          const bodyGrad = ctx.createLinearGradient(gx1, gy1, gx2, gy2);
          if (isSpeaking) {
            bodyGrad.addColorStop(0, "#00F0FF");
            bodyGrad.addColorStop(0.3, "#1558C9");
            bodyGrad.addColorStop(0.65, "#0B1D3D");
            bodyGrad.addColorStop(0.85, "#2563EB");
            bodyGrad.addColorStop(1, "#D4FF24");
          } else if (isRecording) {
            bodyGrad.addColorStop(0, "#D4FF24");
            bodyGrad.addColorStop(0.32, "#00F0FF");
            bodyGrad.addColorStop(0.68, "#0B234A");
            bodyGrad.addColorStop(0.9, "#1558C9");
            bodyGrad.addColorStop(1, "#38BDF8");
          } else {
            bodyGrad.addColorStop(0, "#38BDF8");
            bodyGrad.addColorStop(0.35, "#1558C9");
            bodyGrad.addColorStop(0.7, "#071224");
            bodyGrad.addColorStop(1, "#1E40AF");
          }

          ctx.fillStyle = bodyGrad;
          ctx.fill();

          ctx.strokeStyle = isSpeaking
            ? "rgba(0, 240, 255, 0.75)"
            : isRecording
            ? "rgba(212, 255, 36, 0.85)"
            : "rgba(56, 189, 248, 0.55)";
          ctx.lineWidth = 1.5 + energy * 0.8;
          ctx.stroke();

          // 5. Internal Caustics & Optical Refraction
          ctx.save();
          ctx.clip();

          ctx.globalCompositeOperation = "screen";
          const innerRadius = baseRadius * (0.68 + energy * 0.12);
          const innerGrad = ctx.createRadialGradient(
            cx - innerRadius * 0.25,
            cy - innerRadius * 0.28,
            innerRadius * 0.1,
            cx,
            cy,
            innerRadius
          );
          if (isSpeaking) {
            innerGrad.addColorStop(0, "rgba(255, 255, 255, 0.95)");
            innerGrad.addColorStop(0.28, "rgba(0, 240, 255, 0.85)");
            innerGrad.addColorStop(0.65, "rgba(21, 88, 201, 0.55)");
            innerGrad.addColorStop(1, "rgba(0, 0, 0, 0)");
          } else if (isRecording) {
            innerGrad.addColorStop(0, "rgba(255, 255, 255, 0.9)");
            innerGrad.addColorStop(0.3, "rgba(212, 255, 36, 0.85)");
            innerGrad.addColorStop(0.7, "rgba(0, 240, 255, 0.45)");
            innerGrad.addColorStop(1, "rgba(0, 0, 0, 0)");
          } else {
            innerGrad.addColorStop(0, "rgba(255, 255, 255, 0.8)");
            innerGrad.addColorStop(0.35, "rgba(56, 189, 248, 0.65)");
            innerGrad.addColorStop(0.75, "rgba(21, 88, 201, 0.35)");
            innerGrad.addColorStop(1, "rgba(0, 0, 0, 0)");
          }

          ctx.beginPath();
          ctx.arc(cx - innerRadius * 0.1, cy - innerRadius * 0.1, innerRadius, 0, Math.PI * 2);
          ctx.fillStyle = innerGrad;
          ctx.fill();

          // 6. Gemini 4-Point Celestial Star Core
          ctx.save();
          ctx.translate(cx, cy);
          ctx.rotate(-time * 0.65);

          const starPoints = 4;
          const outerR = baseRadius * (0.55 + energy * 0.28 + Math.sin(time * 3) * 0.05);
          const innerR = outerR * 0.28;

          ctx.beginPath();
          for (let s = 0; s < starPoints * 2; s++) {
            const a = (s / (starPoints * 2)) * Math.PI * 2;
            const rad = s % 2 === 0 ? outerR : innerR;
            const sx = Math.cos(a) * rad;
            const sy = Math.sin(a) * rad;
            if (s === 0) ctx.moveTo(sx, sy);
            else ctx.lineTo(sx, sy);
          }
          ctx.closePath();

          const starGrad = ctx.createRadialGradient(0, 0, 2, 0, 0, outerR);
          starGrad.addColorStop(0, "#FFFFFF");
          starGrad.addColorStop(0.25, isRecording ? "#D4FF24" : "#00F0FF");
          starGrad.addColorStop(0.65, isRecording ? "rgba(0, 240, 255, 0.7)" : "rgba(21, 88, 201, 0.7)");
          starGrad.addColorStop(1, "rgba(3, 4, 7, 0)");

          ctx.fillStyle = starGrad;
          ctx.shadowColor = isRecording ? "rgba(212, 255, 36, 0.9)" : "rgba(0, 240, 255, 0.9)";
          ctx.shadowBlur = 16;
          ctx.fill();
          ctx.restore();

          // Specular highlight
          const specGrad = ctx.createLinearGradient(
            cx - baseRadius * 0.6,
            cy - baseRadius * 0.7,
            cx,
            cy
          );
          specGrad.addColorStop(0, "rgba(255, 255, 255, 0.75)");
          specGrad.addColorStop(0.5, "rgba(255, 255, 255, 0.15)");
          specGrad.addColorStop(1, "rgba(255, 255, 255, 0)");

          ctx.beginPath();
          ctx.ellipse(
            cx - baseRadius * 0.25,
            cy - baseRadius * 0.35,
            baseRadius * 0.38,
            baseRadius * 0.18,
            -Math.PI / 4,
            0,
            Math.PI * 2
          );
          ctx.fillStyle = specGrad;
          ctx.fill();

          ctx.restore();

          // 7. Orbital Particles (In Front)
          particles.forEach((p) => {
            const sinA = Math.sin(p.angle);
            if (sinA >= 0) {
              const cosA = Math.cos(p.angle);
              const orbitR = baseRadius + 18 + p.distOffset;
              const px = cx + cosA * orbitR;
              const py = cy + sinA * (orbitR * p.tilt);
              const alpha = 0.4 + sinA * 0.6;
              ctx.beginPath();
              ctx.arc(px, py, p.size * (1 + energy * 0.3), 0, Math.PI * 2);
              ctx.fillStyle = p.hue === "cyan"
                ? `rgba(56, 189, 248, ${alpha})`
                : `rgba(212, 255, 36, ${alpha})`;
              ctx.shadowColor = p.hue === "cyan" ? "rgba(56, 189, 248, 0.9)" : "rgba(212, 255, 36, 0.9)";
              ctx.shadowBlur = 8;
              ctx.fill();
              ctx.shadowBlur = 0;
            }
          });

          ctx.restore();
          animId = requestAnimationFrame(render);
        };

        animId = requestAnimationFrame(render);
        return () => cancelAnimationFrame(animId);
      }, [isSpeaking, isRecording]);

      const handleOrbClick = (e) => {
        shockwavesRef.current.push({
          r: 25,
          alpha: 1.0
        });
        if (onClick) onClick(e);
      };

      return (
        <div className="ai-companion-stage">
          <div
            className="canvas-ai-orb-anchor"
            onClick={handleOrbClick}
            title="Gemini & OpenAI Voice Organism — Click to speak or pause"

                : isRecording
                ? "LISTENING TO CALLER VOICE..."
                : "CONTINUOUS HANDS-FREE ACTIVE"}
            </span>
          </div>
        </div>
      );

            body: sc.initialReport

            sender: "SyncUp Intake Agent",

        if (!("speechSynthesis" in window)) return;

        const autoSelectNaturalVoice = () => {
          const all = window.speechSynthesis.getVoices();
          if (!all || all.length === 0) return;

          const pleasantPatterns = [
            /google uk english female/i,
            /natural/i,
            /neural/i,
            /samantha/i,
            /victoria/i,
            /serena/i,
            /jenny/i,
            /aria/i,
            /google us english/i
          ];

          let chosen = null;
          for (const pattern of pleasantPatterns) {
            chosen = all.find(v => pattern.test(v.name));
            if (chosen) break;
          }
          if (!chosen) {
            chosen = all.find(v => v.lang.startsWith("en")) || all[0];
          }
          selectedVoiceRef.current = chosen;
        };

        autoSelectNaturalVoice();
        window.speechSynthesis.onvoiceschanged = autoSelectNaturalVoice;
        return () => {
          window.speechSynthesis.onvoiceschanged = null;
        };
      }, []);

      // Continuous Hands-Free Speech Recognition
      useEffect(() => {
        const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRec) return;

        const rec = new SpeechRec();
        rec.continuous = false; // We manage seamless turn-taking
        rec.interimResults = false;
        rec.lang = "en-US";

        rec.onstart = () => {
          setIsRecording(true);
        };

        rec.onend = () => {
          setIsRecording(false);
          // If hands-free is active and agent is NOT speaking, auto-restart listening
          if (isHandsFreeRef.current && !isSpeakingRef.current && isCallActiveRef.current) {
            setTimeout(() => {
              try {
                rec.start();
              } catch (e) {}
            }, 350);
          }
        };

        rec.onerror = (e) => {
          setIsRecording(false);
          if (e.error !== "not-allowed" && isHandsFreeRef.current && !isSpeakingRef.current && isCallActiveRef.current) {
            setTimeout(() => {
              try {
                rec.start();
              } catch (err) {}
            }, 800);

        try {
          rec.start();

        return () => {
          isCallActiveRef.current = false;
          try {
            rec.stop();
          } catch (e) {}

          setIsSpeaking(true);
          setTimeout(() => {
            setIsSpeaking(false);
            if (isHandsFreeRef.current && recognitionRef.current) {
              try { recognitionRef.current.start(); } catch (e) {}
            }
          }, 2200);
          return;
        }

        try {
          window.speechSynthesis.cancel();
          // Pause recognition during speech output to avoid self-echo
          try { recognitionRef.current?.stop(); } catch (e) {}

          const utter = new SpeechSynthesisUtterance(text);
          if (selectedVoiceRef.current) {
            utter.voice = selectedVoiceRef.current;
          }

          utter.pitch = 1.0;
          utter.rate = 0.96; // Pleasant, calm, unhurried cadence
          utter.volume = 1.0;

          utter.onstart = () => {
            setIsSpeaking(true);
          };

          utter.onend = () => {
            setIsSpeaking(false);
            // Hands-Free: automatically resume listening for user's next words!
            if (isHandsFreeRef.current && recognitionRef.current) {
              setTimeout(() => {
                try {
                  recognitionRef.current.start();
                } catch (e) {}
              }, 300);
            }
          };

          utter.onerror = () => {
            setIsSpeaking(false);
            if (isHandsFreeRef.current && recognitionRef.current) {
              setTimeout(() => {
                try { recognitionRef.current.start(); } catch (e) {}
              }, 300);
            }
          };

          window.speechSynthesis.speak(utter);

                    <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
                    <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                    <line x1="12" x2="12" y1="19" y2="22"/>
                  </svg>
                  {isRecording && (
                    <div className="mic-mini-visualizer" aria-hidden="true">
                      <span className="mini-bar b1"></span>
                      <span className="mini-bar b2"></span>
                      <span className="mini-bar b3"></span>
                      <span className="mini-bar b4"></span>
                    </div>
                  )}
                </button>

                {/* Text Fallback Input */}
                <input
                  type="text"
                  className="dock-text-input"
                  placeholder={isRecording ? "Listening hands-free... speak now or type here..." : "Type a message or speak..."}
                  value={inputMsg}
                  onChange={(e) => setInputMsg(e.target.value)}
                />

                {/* Send Button */}
                <button
                  type="submit"
                  className="dock-send-btn"
                  title="Send input"
                >
                  <span>Send</span>
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                    <line x1="22" y1="2" x2="11" y2="13"/>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                  </svg>
                </button>
              </form>
            </section>

            {/* ========================================================
               RIGHT COLUMN (~30%): Compact Live Summary & Quick Escalation Channels
               ======================================================== */}
            <aside className="ticket-dossier-column" aria-label="Incident Summary and Escalation">
              {/* Header with Ticket Tag */}
              <div className="ticket-header-strip">
                <div className="ticket-id-tag">
                  <span className="ruby-strobe-circle" style={{ background: "var(--lime-accent)", boxShadow: "0 0 8px var(--lime-accent)" }}></span>
                  <span className="shimmer-text-element" style={{ "--shimmer-color": "#79B0FF", "--base-color": "#79B0FF", "--duration": "3s" }}>
                    #{activeScenario.ticketId}
                  </span>
                </div>
                <div className="ticket-status-pill p1-urgent">
                  <span className="shimmer-text-element" style={{ "--shimmer-color": "#FFFFFF", "--base-color": "#D4FF24", "--duration": "2.5s" }}>
                    P1 - CRITICAL ESCALATION
                  </span>
                </div>
              </div>

              {/* Scenario Switcher Tabs */}
              <div className="scenario-switcher-row" style={{ display: "flex", gap: "6px", overflowX: "auto", paddingBottom: "4px" }}>
                {INCIDENT_SCENARIOS.map((sc, i) => (
                  <button
                    key={sc.id}
                    type="button"
                    className={`scenario-tab-btn ${scenarioIdx === i ? "active" : ""}`}
                    onClick={() => handleSelectScenario(i)}
                  >
                    {i === 0 ? "📦 Warehouse" : i === 1 ? "💳 FinTech" : "🏥 Hospital"}
                  </button>
                ))}
              </div>

              {/* Incident Title */}
              <div style={{ flexShrink: 0 }}>
                <h2 className="incident-headline">{activeScenario.title}</h2>
              </div>

              {/* 1. Live Plain-Language Summary Window */}
              <div className="summary-card">
                <div className="card-mini-label">
                  <span>📋 LIVE SITUATION SUMMARY</span>
                </div>
                <p className="summary-text">
                  {liveSummary}
                </p>
              </div>

              {/* 2. Key Situation Facts Gathered */}
              <div className="key-details-card">
                <div className="card-mini-label">
                  <span>🔍 GATHERED FACTS ({claims.length})</span>
                </div>
                <ul className="key-details-list">
                  {claims.slice(0, 4).map((c) => (
                    <li key={c.id} className="detail-item">
                      <span className="check-icon">✓</span>
                      <span className="detail-text">{c.text}</span>
                    </li>
                  ))}
                </ul>
              </div>

              {/* 3. Recommended Resolution Team with BorderBeam */}
              <div className="assigned-team-card-wrapper">
                <div className="assigned-team-card">
                  <div className="border-beam-container" aria-hidden="true">
                    <div className="border-beam-tracer" style={{ "--color-from": "#D4FF24", "--color-to": "#1558C9", "--duration": "7s" }}></div>
                  </div>
                  <div className="card-mini-label">
                    <span>🎯 RECOMMENDED RESOLUTION TEAM</span>
                  </div>
                  <div className="team-name">{activeScenario.targetDepartment}</div>
                  <div className="team-routing-note">Auto-selected by AI based on operational symptoms</div>
                </div>
              </div>

              {/* 4. Quick Escalation Channels */}
              <div className="escalation-actions-section">
                <div className="card-mini-label">
                  <span>🚀 QUICK ESCALATION CHANNELS</span>
                </div>
                <div className="escalation-buttons-group">
                  {/* Slack Option */}
                  <button
                    type="button"
                    className={`escalate-btn slack-btn ${dispatchedChannel === 'slack' ? 'dispatched' : ''}`}
                    onClick={() => handleEscalate('slack')}
                    disabled={dispatchedChannel === 'slack'}
                  >
                    <span>💬</span>
                    <span>{dispatchedChannel === 'slack' ? 'Sent to #incident-war-room ✓' : 'Send to Slack'}</span>
                  </button>

                  {/* Email Option */}
                  <button
                    type="button"
                    className={`escalate-btn email-btn ${dispatchedChannel === 'email' ? 'dispatched' : ''}`}
                    onClick={() => handleEscalate('email')}
                    disabled={dispatchedChannel === 'email'}
                  >
                    <span>✉️</span>
                    <span>{dispatchedChannel === 'email' ? 'Dispatched via Email ✓' : 'Send via Email'}</span>
                  </button>

                  {/* SMS / Message Option */}
                  <button
                    type="button"
                    className={`escalate-btn sms-btn ${dispatchedChannel === 'sms' ? 'dispatched' : ''}`}
                    onClick={() => handleEscalate('sms')}
                    disabled={dispatchedChannel === 'sms'}
                  >
                    <span>📱</span>
                    <span>{dispatchedChannel === 'sms' ? 'SMS Alert Dispatched ✓' : 'Send SMS / Message'}</span>
                  </button>
                </div>
              </div>
            </aside>
          </main>

          {/* Floating Glass Toast */}
          {toastMsg && <div className="hume-toast">{toastMsg}</div>}
        </div>
      );
    }

    // Mount to DOM
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
